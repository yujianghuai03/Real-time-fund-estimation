spring:
  application:
    name: yujianghuai-auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/yujianghuai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

server:
  port: 9100

auth:
  secret: change-me
  token-expire-seconds: 7200
  demo-user:
    username: admin
    password: 123456
    roles:
      - ADMIN
  oauth2:
    issuer: http://127.0.0.1:9100
    client-id: yujianghuai-client
    client-secret: yujianghuai-secret
    redirect-uris:
      - http://127.0.0.1:8080/login/oauth2/code/yujianghuai
    scopes:
      - openid
      - profile
      - api.read
      - api.write
    access-token-ttl: 2h
    refresh-token-ttl: 7d

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

app:
  tenant:
    header-name: TENANT-ID
    ignore-paths:
      - /auth/**
      - /actuator/**
      - /error
    ignore-tables:
      - sys_tenant
