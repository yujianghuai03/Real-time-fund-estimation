spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

# 生产环境配置
mybatis-plus:
  configuration:
    # 生产环境禁止输出 SQL 到控制台
    log-impl: ''

app:
  exception:
    # 生产环境禁止打印业务异常完整堆栈
    print-business-stack-trace: false

  email:
    verification-code-limit:
      # 是否启用IP限流
      ip-enabled: true
      # 同一IP每分钟限制次数
      ip-minute-limit: 5
      # 同一IP每小时限制次数
      ip-hour-limit: 30
