spring:
  application:
    name: yujianghuai-boot
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/yujianghuai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
#  rabbitmq:
#    host: 127.0.0.1
#    port: 5672
#    username: guest
#    password: guest

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

auth:
  secret: change-me
  token-expire-seconds: 7200
#  demo-user:
#    username: admin
#    password: 123456
#    roles:
#      - ADMIN
  oauth2:
    issuer: http://127.0.0.1:8080
    client-id: yujianghuai-client
    client-secret: yujianghuai-secret
    redirect-uris:
      - http://127.0.0.1:8080/login/oauth2/code/yujianghuai
    scopes:
      - openid
      - profile
      - api.read
      - api.write
    access-token-ttl: 2h
    refresh-token-ttl: 7d

app:
  exception:
    # 开发测试环境可开启业务异常堆栈日志，生产环境建议保持关闭
    print-business-stack-trace: false
  email:
    host: ${APP_EMAIL_HOST:smtp.qq.com}
    port: ${APP_EMAIL_PORT:465}
    username: ${APP_EMAIL_USERNAME:}
    password: ${APP_EMAIL_PASSWORD:}
    from-name: ${APP_EMAIL_FROM_NAME:Yujianghuai}
    verification-subject: ${APP_EMAIL_VERIFICATION_SUBJECT:邮箱验证码}
    ssl-enable: ${APP_EMAIL_SSL_ENABLE:true}
    auth: ${APP_EMAIL_AUTH:true}
    template-path: email/email.ftl
  tenant:
    header-name: TENANT-ID
    ignore-paths:
      - /auth/**
      - /actuator/**
      - /error
      - /api/funds/search
      - /api/funds/estimate/**
      - /api/funds/indices
      - /admin-api/email/verification-code
    ignore-tables:
      - sys_tenant
