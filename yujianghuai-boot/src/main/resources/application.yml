spring:
  application:
    name: yujianghuai-boot
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/yujianghuai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
#  rabbitmq:
#    host: 127.0.0.1
#    port: 5672
#    username: guest
#    password: guest

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
app:
  exception:
    # 开发测试环境可开启业务异常堆栈日志，生产环境建议保持关闭
    print-business-stack-trace: true
  email:
    host: ${APP_EMAIL_HOST:smtp.qq.com}
    port: ${APP_EMAIL_PORT:465}
    username: ${APP_EMAIL_USERNAME:}
    password: ${APP_EMAIL_PASSWORD:}
    from-name: ${APP_EMAIL_FROM_NAME:Yujianghuai}
    verification-subject: ${APP_EMAIL_VERIFICATION_SUBJECT:邮箱验证码}
    ssl-enable: ${APP_EMAIL_SSL_ENABLE:true}
    auth: ${APP_EMAIL_AUTH:true}
    template-path: email/email.ftl
  tenant:
    header-name: TENANT-ID
    ignore-paths:
      - /auth/**
      - /actuator/**
      - /error
      - /api/funds/search
      - /api/funds/estimate/**
      - /api/funds/indices
      - /admin-api/email/verification-code
    ignore-tables:
      - sys_tenant
