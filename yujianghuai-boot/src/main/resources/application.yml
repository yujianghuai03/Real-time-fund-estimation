spring:
  application:
    name: yujianghuai-boot
  profiles:
    # 默认使用开发环境；后续可通过启动参数或环境变量切换：
    # --spring.profiles.active=prod
    # SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

app:
  security:
    jwt:
      # JWT 密钥编号，会写入 JWT Header 的 kid，方便网关通过 JWKS 找到对应公钥。
      key-id: ${JWT_KEY_ID:yujianghuai-default-key}
      # 生产环境建议通过环境变量覆盖。未配置时使用代码内置默认密钥。
      public-key: ${JWT_PUBLIC_KEY:}
      private-key: ${JWT_PRIVATE_KEY:}
    permit-all:
      paths:
        - /oauth2/**
        - /admin-api/email/verification-code
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html
        - /actuator/health
        - /actuator/info
        - /error
      methods:
        OPTIONS:
          - /**
  email:
    host: ${APP_EMAIL_HOST:smtp.qq.com}
    port: ${APP_EMAIL_PORT:465}
    username: ${APP_EMAIL_USERNAME:}
    password: ${APP_EMAIL_PASSWORD:}
    from-name: ${APP_EMAIL_FROM_NAME:Yujianghuai}
    verification-subject: ${APP_EMAIL_VERIFICATION_SUBJECT:邮箱验证码}
    ssl-enable: ${APP_EMAIL_SSL_ENABLE:true}
    auth: ${APP_EMAIL_AUTH:true}
    template-path: email/email.ftl
  tenant:
    header-name: TENANT-ID
    ignore-paths:
      - /auth/**
      - /actuator/health
      - /actuator/info
      - /error
      - /api/funds/search
      - /api/funds/estimate/**
      - /api/funds/indices
    ignore-tables:
      - sys_tenant
